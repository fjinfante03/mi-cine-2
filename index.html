<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cine</title>
    <link rel="stylesheet" href="style.css?v=20">
</head>
<body>

    <header>
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <h1 onclick="mostrarSeccion('seccion-inicio')">MI CINE</h1>
    </header>

    <nav id="side-menu" class="side-menu">
        <div class="menu-header">
            <h2>Menú</h2>
            <span onclick="toggleMenu()" style="cursor:pointer;">×</span>
        </div>
        <a href="#" onclick="mostrarSeccion('seccion-inicio')">🏠 Inicio</a>
        <a href="#" onclick="mostrarSeccion('nueva-peli')">➕ Añadir Película</a>
        <a href="#" onclick="mostrarSeccion('seccion-listado')">📚 Mi Lista</a>
    </nav>

    <main>
        <section id="seccion-inicio" class="container">
            <div style="text-align:center; padding:50px 20px;">
                <h2>Bienvenido</h2>
                <button onclick="mostrarSeccion('nueva-peli')" style="padding:15px; background:red; color:white; border:none; border-radius:10px;">Añadir Película</button>
            </div>
        </section>

        <section id="nueva-peli" class="container" style="display:none;">
            <div style="background:#222; padding:15px; border-radius:10px; margin-bottom:20px;">
                <input type="text" id="input-api" placeholder="Buscar peli en internet..." style="width:70%; padding:10px;">
                <button onclick="buscarPeliEnAPI()" style="padding:10px; background:red; color:white; border:none;">BUSCAR</button>
                <div id="resultados-api" style="display:none; background:#111; margin-top:10px;"></div>
            </div>

            <form id="form-pelicula">
                <input type="text" id="titulo" placeholder="Título" required style="width:100%; margin-bottom:10px; padding:10px;">
                <input type="text" id="fotoPortada" placeholder="URL Portada" style="width:100%; margin-bottom:10px; padding:10px;">
                <button type="button" onclick="validarYGuardar('vista')" style="width:100%; padding:15px; background:green; color:white; border:none;">GUARDAR</button>
            </form>
        </section>

        <section id="seccion-listado" class="container" style="display:none;">
            <h2>Mis Películas</h2>
            <div id="lista-peliculas" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>
        </section>
    </main>

    <script src="script.js?v=20"></script>
</body>
</html>
