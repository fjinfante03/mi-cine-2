<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CinePro Ultra - Filmaffinity Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css?v=4.0">
</head>
<body>

    <header>
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <h1 onclick="mostrarSeccion('inicio')">MI CINE</h1>
        <div style="width: 25px;"></div>
    </header>

    <nav id="side-menu" class="side-menu">
        <div class="menu-header">
            <h2>Menú</h2>
            <span onclick="toggleMenu()">&times;</span>
        </div>
        <a href="#" onclick="mostrarSeccion('inicio')">🏠 Inicio</a>
        <a href="#" onclick="irAListadoEspecial('vista')">🎬 Pelis Vistas</a>
        <a href="#" onclick="irAListadoEspecial('pendiente')">⏳ Pelis Pendientes</a>
        <a href="#" onclick="mostrarSeccion('listado')">📚 Toda la Biblioteca</a>
        <hr>
        <a href="#" onclick="mostrarSeccion('seccion-directores')">👤 Directores</a>
        <a href="#" onclick="mostrarSeccion('seccion-actores')">🎭 Actores</a>
        <a href="#" onclick="mostrarSeccion('nueva-peli')">➕ Añadir Película</a>
    </nav>

    <main>
        <div class="search-container" id="contenedor-busqueda" style="display:none;">
            <input type="text" id="buscador" placeholder="🔍 Buscar..." oninput="ejecutarBusqueda()">
        </div>

        <section id="seccion-inicio" class="container">
            <div class="welcome-card">
                <h2>¡Bienvenido!</h2>
                <button onclick="mostrarSeccion('nueva-peli')" class="btn-save bg-red">Añadir Película</button>
            </div>
        </section>

        <section id="nueva-peli" class="container" style="display:none;">
            <h2>Nueva Película</h2>
            <form id="form-pelicula">
                <input type="hidden" id="edit-id">
                <div class="input-group"><label>Título</label><input type="text" id="titulo" required></div>
                
                <div class="grid-2">
                    <div class="input-group">
                        <label>Director 🔍</label>
                        <input type="text" id="nombreDirector" onblur="buscarEnTMDB(this.value, 'director')">
                    </div>
                    <div class="input-group"><label>Foto Director (URL)</label><input type="text" id="fotoDirector"></div>
                </div>
                <input type="hidden" id="nacimientoDirector">
                <input type="hidden" id="origenDirector">
                <input type="hidden" id="bioDirector">

                <div class="input-group">
                    <label>Reparto</label>
                    <div id="contenedor-actores"></div>
                    <button type="button" onclick="agregarCampoActor()" class="btn-add-actor">+ Añadir Actor</button>
                </div>

                <div class="input-group"><label>Portada (URL)</label><input type="text" id="fotoPortada"></div>
                <div class="grid-2">
                    <div class="input-group"><label>Género</label><input type="text" id="genero"></div>
                    <div class="input-group"><label>Año</label><input type="number" id="anio"></div>
                </div>
                <div class="grid-2">
                    <div class="input-group"><label>Nota</label><input type="number" id="nota" step="0.1"></div>
                    <div class="input-group"><label>Plataforma</label><input type="text" id="plataforma"></div>
                </div>
                <div class="grid-2">
                    <button type="button" onclick="validarYGuardar('vista')" class="btn-save bg-green">VISTA</button>
                    <button type="button" onclick="validarYGuardar('pendiente')" class="btn-save bg-yellow">PENDIENTE</button>
                </div>
            </form>
        </section>

        <section id="seccion-listado" class="container" style="display:none;">
            <div class="tabs">
                <button id="tab-todas" class="tab-btn active" onclick="cambiarTab('todas')">Todas</button>
                <button id="tab-vista" class="tab-btn" onclick="cambiarTab('vista')">Vistas</button>
                <button id="tab-pendiente" class="tab-btn" onclick="cambiarTab('pendiente')">Pendientes</button>
            </div>
            <div id="lista-peliculas" class="grid-peliculas"></div>
        </section>

        <section id="seccion-directores" class="container" style="display:none;">
            <h2>Directores</h2>
            <div id="lista-directores"></div>
        </section>

        <section id="seccion-actores" class="container" style="display:none;">
            <h2>Actores</h2>
            <div id="lista-actores"></div>
        </section>
    </main>

    <div id="modal-img" class="modal" onclick="this.style.display='none'"><img id="img-ampliada"></div>
    
    <script src="script.js?v=4.0"></script>
</body>
</html>
