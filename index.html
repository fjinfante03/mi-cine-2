<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Automático</title>
    <style>
        body { background: #000; color: white; font-family: sans-serif; margin: 0; text-align: center; }
        header { background: #111; padding: 15px; border-bottom: 2px solid red; position: sticky; top: 0; z-index: 100; }
        .nav-btns { display: flex; justify-content: space-around; background: #111; padding: 10px; }
        .nav-btns button { background: none; border: 1px solid red; color: red; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        
        .seccion { padding: 20px; display: none; }
        input { width: 85%; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 16px; }
        .btn-buscar { background: red; color: white; padding: 15px; border: none; border-radius: 8px; width: 85%; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        #resultados { margin-top: 20px; display: grid; grid-template-columns: 1fr; gap: 15px; }
        .res-item { background: #1a1a1a; padding: 10px; border-radius: 10px; display: flex; align-items: center; cursor: pointer; border: 1px solid #333; text-align: left; }
        .res-item img { width: 60px; border-radius: 5px; margin-right: 15px; }
        .res-item div { flex: 1; }

        .grid-lista { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 10px; }
        .peli-card { background: #111; border-radius: 10px; overflow: hidden; border: 1px solid #222; position: relative; }
        .peli-card img { width: 100%; display: block; }
        .peli-card p { padding: 8px; font-size: 12px; margin: 0; height: 35px; overflow: hidden; }
        .btn-borrar { position: absolute; top: 5px; right: 5px; background: rgba(255,0,0,0.7); color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h2 style="color:red; margin:0;">MI CINE AUTO</h2>
    </header>

    <div class="nav-btns">
        <button onclick="ver('add')">➕ AÑADIR</button>
        <button onclick="ver('lista')">📚 MI LISTA</button>
    </div>

    <section id="add" class="seccion" style="display:block;">
        <input type="text" id="input-busqueda" placeholder="Escribe película...">
        <button class="btn-buscar" onclick="buscarPeli()">BUSCAR Y AÑADIR</button>
        <div id="resultados"></div>
    </section>

    <section id="lista" class="seccion">
        <h3>Mi Colección</h3>
        <div id="grid-lista" class="grid-lista"></div>
    </section>

    <script>
        // Base de datos simple
        let misPelis = JSON.parse(localStorage.getItem('biblioteca_cine')) || [];

        function ver(id) {
            document.querySelectorAll('.seccion').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            if(id === 'lista') renderLista();
        }

        async function buscarPeli() {
            const query = document.getElementById('input-busqueda').value;
            if(!query) return;
            const resDiv = document.getElementById('resultados');
            resDiv.innerHTML = "<p>Buscando...</p>";

            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=854e46049386f788b77a1188730b200b&query=${encodeURIComponent(query)}&language=es-ES`);
                const data = await response.json();
                resDiv.innerHTML = "";

                data.results.slice(0, 5).forEach(p => {
                    const imgUrl = p.poster_path ? "https://image.tmdb.org/t/p/w200" + p.poster_path : "https://via.placeholder.com/200x300?text=No+Image";
                    
                    const item = document.createElement('div');
                    item.className = 'res-item';
                    item.innerHTML = `
                        <img src="${imgUrl}">
                        <div>
                            <strong>${p.title}</strong><br>
                            <small style="color:#888">${p.release_date ? p.release_date.split('-')[0] : ''}</small>
                            <p style="margin:5px 0 0 0; color:red; font-size:12px;">Toc para añadir ↑</p>
                        </div>
                    `;
                    item.onclick = () => autoGuardar(p.title, imgUrl);
                    resDiv.appendChild(item);
                });
            } catch (e) {
                resDiv.innerHTML = "Error de conexión.";
            }
        }

        function autoGuardar(titulo, imagen) {
            misPelis.push({ titulo, imagen });
            localStorage.setItem('biblioteca_cine', JSON.stringify(misPelis));
            alert("¡" + titulo + " añadida a tu lista!");
            document.getElementById('input-busqueda').value = "";
            document.getElementById('resultados').innerHTML = "";
            ver('lista');
        }

        function borrarPeli(index) {
            misPelis.splice(index, 1);
            localStorage.setItem('biblioteca_cine', JSON.stringify(misPelis));
            renderLista();
        }

        function renderLista() {
            const contenedor = document.getElementById('grid-lista');
            contenedor.innerHTML = "";
            if(misPelis.length === 0) {
                contenedor.innerHTML = "<p style='grid-column:1/3'>Tu lista está vacía.</p>";
                return;
            }
            misPelis.forEach((p, index) => {
                contenedor.innerHTML += `
                    <div class="peli-card">
                        <button class="btn-borrar" onclick="borrarPeli(${index})">×</button>
                        <img src="${p.imagen}">
                        <p>${p.titulo}</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
